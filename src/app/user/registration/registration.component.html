<div class="bg-white border max-w-md mx-auto mb-10">
  <div class="bg-indigo-500 relative">
    <div class="text-white py-10">
      <h3 class="text-center text-lg font-bold tracking-wide">School X</h3>
    </div>

    <div
      class="flex justify-center items-center absolute top-20 w-full mx-auto"
    >
      <h2
        class="bg-slate-100 p-4 uppercase text-xl font-bold border-b-2 border-indigo-500"
      >
        ShineCoder
      </h2>
    </div>
  </div>

  <form class="mt-20 flex flex-col justify-center items-center">
    <div class="mb-4">
      <label for="">Username</label><br />
      <input
        type="text"
        placeholder="Enter your username"
        class="border px-4 py-1 mt-1"
      />
    </div>

    <div class="mb-4">
      <label for="">Email</label><br />
      <input
        type="email"
        placeholder="Enter your email"
        class="border px-4 py-1 mt-1"
      />
    </div>

    <div class="mb-4">
      <label for="">Full Name</label><br />
      <input
        type="text"
        placeholder="Enter your full name"
        class="border px-4 py-1 mt-1"
      />
    </div>

    <div class="mb-4">
      <label for="">Password</label><br />
      <input
        type="passowrd"
        placeholder="Enter your password"
        class="border px-4 py-1 mt-1"
      />
    </div>

    <div class="mb-4">
      <label for="">Confirm Password</label><br />
      <input
        type="password"
        placeholder="Confirm your password"
        class="border px-4 py-1 mt-1"
      />
    </div>

    <button type="submit" class="bg-indigo-500 text-white px-4 py-1">
      Sign up
    </button>
  </form>

  <div class="text-center mb-10">
    <p class="mt-4">
      Already Have An Account? <a href="#" class="text-indigo-500">Log in</a>
    </p>
  </div>
</div>
